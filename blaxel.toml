name = "hermes-agent"
type = "sandbox"
description = "Hermes Agent (Nous Research) on Alpine, with node-gyp toolchain for native module builds"

[runtime]
generation = "mk3"
memory = 4096              # bump to 8192 if you run heavy multi-agent workloads

# Expose whatever port Hermes's own tooling/API listens on if applicable —
# adjust target to match; remove this block entirely if Hermes has no
# network-facing component and you're only driving it via sandbox-api exec.
[[runtime.ports]]
name = "hermes-api"
target = 8000
protocol = "tcp"

[env]
NODE_ENV = "production"
